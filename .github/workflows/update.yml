name: Update from upstream

# 起動条件は決定論。上流が動いただけでは何もしない（Claude も呼ばず、PR も作らない）。
# scripts/check-staleness.mjs が「ノートの検査可能な主張が実際に壊れた」と判定した場合にかぎり起動する。
# ページは基点 SHA を直書きしない（リンクは blob/v2 形式で、表示時に app.js が
# docs/assets/base.js の基点へ合成する）ので、基点更新は meta.json + base.js の
# 2 ファイルに閉じ、内容を直したページだけが PR の差分に現れる。
#
# 作業は 2 系統に分けて別々の Claude セッションで実行する。
#   1. ミラー追随（逐語訳）  ... 上流 docs の変更に従う
#   2. 解説ページ更新        ... 抜粋の行ズレ・実数値・参照パスの破れに従う
# 分ける理由は 3 つ。片方だけ必要な日にもう片方を起こさない、文脈を短く保つ、
# 片方が落ちてももう片方の成果をブランチに残す。
#
# pull_request では動かさない。fork から OIDC を引く経路を作らないため、
# トリガは schedule と workflow_dispatch（書き込み権限者のみ）に限定する。
on:
  schedule:
    - cron: '0 21 * * *'   # 毎日 06:00 JST
  workflow_dispatch:
    inputs:
      force_llm:
        description: '差分がなくても Claude を起動する（プロンプト調整の確認用）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: update-from-upstream
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UPSTREAM: /tmp/aidlc-upstream
    steps:
      # push は GITHUB_TOKEN を明示した remote URL で行うため、checkout の認証情報に
      # 依存しない。claude-code-action は後処理で App トークンを revoke するので、
      # git config に認証を残す構成は当てにできない。
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch upstream v2
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/awslabs/aidlc-workflows "$UPSTREAM"
          git -C "$UPSTREAM" fetch --quiet origin v2
          echo "上流 origin/v2: $(git -C "$UPSTREAM" rev-parse origin/v2)"

      # 判定本体。系統ごとのフラグ（needsMirror / needsPages）も出す。
      - name: Check staleness
        id: stale
        run: |
          node scripts/check-staleness.mjs --json > /tmp/staleness.json || true
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("/tmp/staleness.json", "utf8"));
            const out = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(out, `verdict=${r.verdict}\n`);
            fs.appendFileSync(out, `needs_mirror=${r.needsMirror === true}\n`);
            fs.appendFileSync(out, `needs_pages=${r.needsPages === true}\n`);
            fs.appendFileSync(out, `old_sha=${r.oldSha ?? ""}\n`);
            fs.appendFileSync(out, `new_sha=${r.newSha ?? ""}\n`);
            fs.appendFileSync(out, `commits=${r.commits ?? 0}\n`);
            fs.appendFileSync(out, `docs_count=${(r.signals?.docsChanged ?? []).length}\n`);
          '
          node scripts/check-staleness.mjs || true

          # force_llm は動作確認用の経路。判定はここで 1 度だけ解き、以降のステップは
          # 単純な真偽だけを見る。&& と || を混ぜると優先順位で意図がぶれるため。
          # up-to-date（基点 = 上流 HEAD）も consistent（上流は進んだが主張は全て成立）も
          # 何もしない。進めるのは needs-update だけ。
          FORCE='${{ inputs.force_llm }}'
          V=$(node -e 'console.log(require("/tmp/staleness.json").verdict)')
          if [ "$FORCE" = 'true' ] || [ "$V" = 'needs-update' ]; then
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
          fi
          if [ "$FORCE" = 'true' ]; then
            echo 'run_mirror=true' >> "$GITHUB_OUTPUT"
            echo 'run_pages=true' >> "$GITHUB_OUTPUT"
          else
            node -e '
              const r = require("/tmp/staleness.json"), fs = require("fs");
              const out = process.env.GITHUB_OUTPUT;
              fs.appendFileSync(out, `run_mirror=${r.needsMirror === true}\n`);
              fs.appendFileSync(out, `run_pages=${r.needsPages === true}\n`);
            '
          fi

      - name: Summarise the verdict
        run: |
          {
            echo "### 陳腐化の判定"
            echo ''
            echo '```'
            node scripts/check-staleness.mjs || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop when nothing is broken
        if: steps.stale.outputs.proceed == 'false'
        run: echo "検査可能な主張がすべて成立。更新不要（基点はノートを直す PR でだけ進む）。"

      # 未マージの update PR があるうちは新規起票しない。毎日実行なので、
      # レビュー待ちの PR を放置している間に日ごとの PR が積み上がるのを防ぐ。
      - name: Check for an open update PR or existing branch
        id: existing
        if: steps.stale.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN=$(gh pr list --repo '${{ github.repository }}' --state open \
                   --json number,headRefName \
                   --jq '[.[] | select(.headRefName | startswith("update/"))] | .[0] // empty')
          if [ -n "$OPEN" ]; then
            NUM=$(echo "$OPEN" | jq -r .number)
            HEAD=$(echo "$OPEN" | jq -r .headRefName)
            echo "::notice::未マージの更新 PR #${NUM} (${HEAD}) があるため新規起票をスキップします。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="update/upstream-$(echo '${{ steps.stale.outputs.new_sha }}' | cut -c1-7)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::notice::ブランチ $BRANCH が既に存在するためスキップします。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        if: steps.stale.outputs.proceed == 'true' && steps.existing.outputs.skip == 'false'
        working-directory: scripts/mirror-build
        run: npm ci --omit=dev --ignore-scripts || npm install --omit=dev --ignore-scripts

      - name: Prepare the working branch
        if: steps.stale.outputs.proceed == 'true' && steps.existing.outputs.skip == 'false'
        env:
          BRANCH: ${{ steps.existing.outputs.branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git -C "$UPSTREAM" checkout --quiet '${{ steps.stale.outputs.new_sha }}'

      - name: Configure AWS credentials (OIDC)
        if: steps.stale.outputs.proceed == 'true' && steps.existing.outputs.skip == 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-west-2

      # 系統 1: ミラー追随。上流 docs が変わった日だけ動く。
      - name: Load the mirror prompt
        if: steps.stale.outputs.run_mirror == 'true' && steps.existing.outputs.skip == 'false'
        uses: ./.github/actions/load-prompt
        with:
          prompt-file: prompts/mirror.md
          old-sha: ${{ steps.stale.outputs.old_sha }}
          new-sha: ${{ steps.stale.outputs.new_sha }}
          docs-count: ${{ steps.stale.outputs.docs_count }}

      - name: Retranslate the mirror with Claude
        id: mirror
        continue-on-error: true
        if: steps.stale.outputs.run_mirror == 'true' && steps.existing.outputs.skip == 'false'
        uses: anthropics/claude-code-action@v1
        env:
          UPSTREAM: /tmp/aidlc-upstream
        with:
          use_bedrock: "true"
          # ミラーは逐語訳で判断の要素が少なく、パリティゲートが構造の崩れを機械的に弾く。
          # 実測のターン単価も解説側より短い（6.9 秒 / 9.2 秒）ので Sonnet で足りる。
          # 解説ページ側は文章の判断が入るため Opus を維持する。
          claude_args: |
            --model us.anthropic.claude-sonnet-5
            --max-turns 300
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash"
          prompt: ${{ env.AGENT_PROMPT }}
      # 系統 2: 解説ページ。抜粋の行ズレ・実数値の陳腐化・参照切れがある日だけ動く。
      - name: Load the pages prompt
        if: steps.stale.outputs.run_pages == 'true' && steps.existing.outputs.skip == 'false'
        uses: ./.github/actions/load-prompt
        with:
          prompt-file: prompts/pages.md
          old-sha: ${{ steps.stale.outputs.old_sha }}
          new-sha: ${{ steps.stale.outputs.new_sha }}

      - name: Update the authored pages with Claude
        id: pages
        continue-on-error: true
        if: steps.stale.outputs.run_pages == 'true' && steps.existing.outputs.skip == 'false'
        uses: anthropics/claude-code-action@v1
        env:
          UPSTREAM: /tmp/aidlc-upstream
        with:
          use_bedrock: "true"
          claude_args: |
            --model us.anthropic.claude-opus-5
            --max-turns 200
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash"
          prompt: ${{ env.AGENT_PROMPT }}
      # 基点更新は決定論ステップ。Claude が落ちても、そこまでの成果を PR として残す。
      # ページは基点を直書きしないので、更新は meta.json と docs/assets/base.js の
      # 2 ファイルだけ。実作業（コミットまたは未コミット変更）があるときにかぎり進める。
      - name: Advance the base commit
        if: always() && steps.stale.outputs.proceed == 'true' && steps.existing.outputs.skip == 'false'
        env:
          NEW: ${{ steps.stale.outputs.new_sha }}
        run: |
          if [ -z "$(git log origin/main..HEAD --oneline)" ] && [ -z "$(git status --porcelain)" ]; then
            echo "変更がないため基点を進めません。"
            exit 0
          fi
          bash scripts/bump-base.sh "$NEW"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: 基点コミットを $(echo "$NEW" | cut -c1-7) へ更新"
          fi

      - name: Open the pull request
        if: always() && steps.stale.outputs.proceed == 'true' && steps.existing.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.existing.outputs.branch }}
          OLD: ${{ steps.stale.outputs.old_sha }}
          NEW: ${{ steps.stale.outputs.new_sha }}
          MIRROR_DONE: ${{ steps.mirror.outcome }}
          PAGES_DONE: ${{ steps.pages.outcome }}
        run: |
          if git diff --quiet HEAD origin/main -- . 2>/dev/null; then
            echo "変更なし。PR を作りません。"
            exit 0
          fi
          if [ -z "$(git log origin/main..HEAD --oneline)" ]; then
            echo "コミットがありません。PR を作りません。"
            exit 0
          fi

          SHORT_NEW=$(echo "$NEW" | cut -c1-7)

          # claude-code-action は後処理で GitHub App のインストールトークンを revoke するため、
          # actions/checkout が仕込んだ認証ヘッダはこの時点で無効になっている。
          # push は GITHUB_TOKEN を明示した remote URL で行う。
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"

          # 検証が通るかどうかで WIP 判定する
          TITLE="feat: 上流 ${SHORT_NEW} に追随"
          STATUS_OK=true
          node scripts/check-staleness.mjs > /tmp/final-check.txt 2>&1 || STATUS_OK=false
          if [ "$STATUS_OK" != true ]; then
            TITLE="[WIP] feat: 上流 ${SHORT_NEW} に追随（未完）"
          fi

          {
            echo "上流 \`awslabs/aidlc-workflows\` の \`v2\` を \`$(echo "$OLD" | cut -c1-7)\` → \`${SHORT_NEW}\` に追随させました。"
            echo ""
            echo "## コミット"
            git log origin/main..HEAD --format='- %s'
            echo ""
            echo "## 追随後の検査結果"
            echo '```'
            cat /tmp/final-check.txt
            echo '```'
            if [ -f /tmp/manual-followup.md ]; then
              echo ""
              echo "## 要手動対応"
              cat /tmp/manual-followup.md
            fi
            if [ "$STATUS_OK" != true ]; then
              echo ""
              echo "検査が \`up-to-date\` にならなかったため WIP です。残りを手元で仕上げてください。"
            fi
            echo ""
            echo "cc @mazyu36"
          } > /tmp/pr-body.md

          gh pr create --title "$TITLE" --body-file /tmp/pr-body.md --head "$BRANCH" --base main
